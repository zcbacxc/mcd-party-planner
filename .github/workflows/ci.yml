name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# 并发控制策略：
# - PR：以 pr-<编号> 分组，amend + force-push 时取消旧运行，避免重复占用
# - push 到 main：以 ref 名分组，每次推送都跑完，保证主干有明确的通过/失败信号
# - workflow_dispatch：以 run_id 分组，手动触发永不被取消
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # 单元测试矩阵：无需安装依赖（项目仅用标准库）、无需 Token、无需网络
  #
  # 运行环境说明：`ubuntu-latest` 已切换到 Ubuntu 26.04，其 setup-python 版本清单中
  # 不再提供 3.9 / 3.10 的 x64 构建（会报 "The version '3.9' ... was not found"）。
  # 因此旧版本固定在 ubuntu-22.04 上验证，新版本使用 latest。
  test-matrix:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.9"
            os: ubuntu-22.04
          - python-version: "3.10"
            os: ubuntu-22.04
          - python-version: "3.11"
            os: ubuntu-latest
          - python-version: "3.12"
            os: ubuntu-latest
          - python-version: "3.13"
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Verify CLI entry points
        run: |
          python -m src.cli --help
          python -m src.cli plan --help
          python -m src.cli selfcheck

  # 真实 MCP 端到端冒烟：需要 Token，未配置该 Secret 时自动跳过（脚本以 0 退出）
  #
  # 注意：`secrets` 上下文在 `jobs.<job_id>.if` 中不可用（仅 github/needs/vars/inputs），
  # 一旦使用会导致整份工作流校验失败（0 job、0 秒失败）。因此改为「步骤级探测 + 输出判断」。
  #
  # 跳过 ≠ 通过：`tokenReady` 输出会被汇总任务读取，未配置 Secret 时以 warning 明确告知
  # 「本次 CI 只验证离线单测」，避免把绿勾误读为「真实链路已验证」。
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tokenReady: ${{ steps.token.outputs.ready }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check MCD_MCP_TOKEN availability
        id: token
        env:
          MCD_MCP_TOKEN: ${{ secrets.MCD_MCP_TOKEN }}
        run: |
          if [ -n "$MCD_MCP_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "::notice::已配置 MCD_MCP_TOKEN，将执行真实 MCP 冒烟"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 MCD_MCP_TOKEN Secret，本次 CI 不验证真实 MCP 链路"
          fi

      - name: Run MCP smoke test
        if: steps.token.outputs.ready == 'true'
        env:
          MCD_MCP_TOKEN: ${{ secrets.MCD_MCP_TOKEN }}
        run: python tests/smoke.py --city 成都 --keyword 春熙路 --headcount 8 --budget 400

  # 汇总门禁：名称固定为 test，便于配置分支保护时作为必需检查项
  # （矩阵任务会生成 test-matrix (3.9) 这类名称，无法直接作为必需检查）
  #
  # 门禁范围：单元测试矩阵 + 真实冒烟（若已配置 Secret）。冒烟失败则门禁失败；
  # 未配置 Secret 时冒烟被跳过，门禁通过但会在日志里明确标注覆盖缺口。
  test:
    needs: [test-matrix, smoke]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.test-matrix.result }}" != "success" ]]; then
            echo "Unit tests: ${{ needs.test-matrix.result }}"
            exit 1
          fi
          echo "Unit tests passed on all Python versions"

          if [[ "${{ needs.smoke.result }}" != "success" ]]; then
            echo "Real MCP smoke: ${{ needs.smoke.result }}"
            exit 1
          fi
          echo "Real MCP smoke job finished: ${{ needs.smoke.result }}"

      - name: Report real-MCP coverage
        run: |
          if [[ "${{ needs.smoke.outputs.tokenReady }}" == "true" ]]; then
            echo "::notice::本次 CI 已验证真实 MCP 链路（三场景冒烟）"
          else
            echo "::warning::真实 MCP 冒烟未执行：仓库未配置 MCD_MCP_TOKEN Secret，本次 CI 仅验证离线单测。如需覆盖真实链路，请在 Settings → Secrets and variables → Actions 添加 MCD_MCP_TOKEN。"
          fi
